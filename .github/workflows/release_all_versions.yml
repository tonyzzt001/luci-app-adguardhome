name: Compile and Release All OpenWrt Versions

on:
  push:
    branches:
      - master
    paths:
      - "luci-app-adguardhome/**"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release Version (e.g., 1.8-13) - leave empty to auto-detect"
        required: false
        default: ""
      release_title:
        description: "Release Title"
        required: false
        default: "luci-app-adguardhome Release"
      skip_release:
        description: "Skip GitHub Release (compile only)"
        type: boolean
        required: false
        default: false

jobs:
  Compile-All:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - name: "23.05.3"
            short: "23"
            gcc: "12.3.0"
            ext: "tar.xz"
            url: "https://downloads.openwrt.org/releases/23.05.3/targets/x86/64/openwrt-sdk-23.05.3-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz"
          - name: "24.10.3"
            short: "24"
            gcc: "13.3.0"
            ext: "tar.zst"
            url: "https://downloads.openwrt.org/releases/24.10.3/targets/x86/64/openwrt-sdk-24.10.3-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          - name: "25.12.3"
            short: "25"
            gcc: "14.3.0"
            ext: "tar.zst"
            url: "https://downloads.openwrt.org/releases/25.12.3/targets/x86/64/openwrt-sdk-25.12.3-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
    name: Compile OpenWrt ${{ matrix.version.short }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential curl git tar wget python3 rsync zstd

      - name: Download OpenWrt ${{ matrix.version.short }} SDK
        run: |
          cd ..
          mkdir -p openwrt-sdk
          curl -fSLk --connect-timeout 30 --retry 2 \
            "${{ matrix.version.url }}" \
            -o "./openwrt-sdk/SDK.${{ matrix.version.ext }}"
          cd openwrt-sdk
          if [ "${{ matrix.version.ext }}" = "tar.zst" ]; then
            tar --use-compress-program=zstd -xf SDK.${{ matrix.version.ext }} --strip-components=1
          else
            tar xf SDK.${{ matrix.version.ext }} --strip-components=1
          fi
          ls -la

      - name: Prepare Package Source
        run: |
          cd ../openwrt-sdk
          mkdir -p package/custom/luci-app-adguardhome
          cp -rf ../luci-app-adguardhome/luci-app-adguardhome/. package/custom/luci-app-adguardhome/
          ls -la package/custom/

      - name: Update Feeds
        run: |
          cd ../openwrt-sdk
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a || true

      - name: Configure SDK
        run: |
          cd ../openwrt-sdk
          make defconfig

      - name: Compile IPK Package
        run: |
          cd ../openwrt-sdk
          make package/custom/luci-app-adguardhome/compile V=s 2>&1 | tail -100

      - name: Collect Build Artifacts
        run: |
          cd ..
          mkdir -p ipk_output
          VER="${{ matrix.version.short }}"
          for f in openwrt-sdk/bin/packages/x86_64/base/luci-app-adguardhome_*.ipk; do
            if [ -f "$f" ]; then
              filename=$(basename "$f")
              newname=$(echo "$filename" | sed "s/_all_/_openwrt${VER}_all_/")
              cp "$f" "ipk_output/${newname}"
              echo "Found: $newname"
            fi
          done
          ls -la ipk_output/

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-adguardhome-openwrt${{ matrix.version.short }}
          path: ../ipk_output/*.ipk
          retention-days: 90
